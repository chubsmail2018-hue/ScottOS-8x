# ScottOS 8x Kernel Parameters
# Boot-time kernel configuration

# GRUB kernel parameters
KERNEL_PARAMS="
  quiet
  splash
  vt_handoff
  nomodeset
  systemd.show_status=auto
  rd.systemd.show_status=auto
  rd.udev.log_priority=3
  systemd.log_level=warning
"

# Kernel module parameters
MODULE_PARAMS={
  "nouveau": "off",
  "nvidia": "modeset=1",
  "radeon": "si_support=1,cik_support=1",
  "amdgpu": "si_support=1,cik_support=1",
  "psmouse": "proto=imps",
  "i915": "enable_psr=1,enable_fbc=1"
}

# Early boot modules to load
EARLY_MODULES=(
  "dm_crypt"
  "ext4"
  "vfat"
  "virtio_blk"
  "virtio_net"
)

# Performance tuning
VM_PARAMS={
  "vm.swappiness": "10",
  "vm.dirty_ratio": "5",
  "vm.dirty_background_ratio": "2",
  "vm.max_map_count": "262144"
}

# IO scheduling
IO_SCHEDULER="mq-deadline"

# CPU frequency scaling
CPUFREQ_GOVERNOR="schedutil"
