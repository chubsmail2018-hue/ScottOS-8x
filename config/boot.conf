# ScottOS 8x Boot Configuration
# System boot parameters and startup sequence

[Boot]
Timeout = 10
DefaultEntry = 0
SplashScreen = true
Quiet = false
Debug = false

[BootAnimation]
Enabled = true
Type = progress-bar
Duration = 5
FPS = 30

[BootTheme]
Background = /usr/share/scottos/backgrounds/boot-splash.png
TextColor = #FFFFFF
ProgressBarColor = #0078D4
AccentColor = #00B7EF

[EarlyBoot]
LoadModules = true
InitializeDevices = true
MountFilesystems = true
RunFsck = true

[Services]
EnableKernelLogging = true
EnableUdev = true
EnableNetworkManager = true
EnablePulseAudio = true

[Performance]
ParallelBoot = true
RamDiskSize = 512M
CompressionType = lz4

[Security]
EnableSecureBoot = false
EnableTPM = true
EnableSELinux = false
EnableAppArmor = true
